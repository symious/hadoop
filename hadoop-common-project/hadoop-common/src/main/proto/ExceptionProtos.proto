message ThrowableProto {
  optional string className = 1;
  optional string errorMessage = 2;
  optional bytes stackTrace = 3;
  optional bytes cause = 4;
}

message UnresolvedPathExceptionProto {
  optional string path          = 1;        // The path containing the link
  optional string preceding     = 2;        // The path part preceding the link
  optional string remainder     = 3;        // The path part following the link
  optional string linkTarget    = 4;        // The link's target
}

message ExceptionProto {
  optional string name       = 1;
  optional string message    = 2;

  oneof ExceptionDetails {
    ThrowableProto throwable = 3;
    UnresolvedPathExceptionProto unresolvedPathException = 4;
  }
}